<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Blessings Surgical Stores</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      margin: 0;
      color: #222;
    }

    .header {
      background: #17365d;
      color: white;
      padding: 22px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .card {
      max-width: 650px;
      margin: 24px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
    }

    button {
      width: 100%;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #17365d;
      color: white;
    }

    #reader {
      margin-top: 18px;
      width: 100%;
    }

    #result {
      margin-top: 18px;
      padding: 18px;
      border-radius: 10px;
      background: #d9ead3;
      font-size: 22px;
      display: none;
      word-break: break-word;
    }

    #error {
      margin-top: 18px;
      padding: 18px;
      border-radius: 10px;
      background: #f4cccc;
      display: none;
    }
  </style>
</head>

<body>

<div class="header">
  Blessings Surgical Stores
</div>

<div class="card">

  <h2>iPad QR Camera Test</h2>

  <p>
    Tap the button below, allow camera access,
    and scan one of the printed staff QR codes.
  </p>

  <button onclick="startScanner()">
    📷 START QR CAMERA
  </button>

  <div id="reader"></div>

  <div id="result"></div>

  <div id="error"></div>

</div>


<script>

let scanner = null;

async function startScanner() {

  document.getElementById("result").style.display = "none";
  document.getElementById("error").style.display = "none";

  try {

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: function(width, height) {

          const size =
            Math.floor(
              Math.min(width, height) * 0.7
            );

          return {
            width: size,
            height: size
          };
        }
      },

      async function(decodedText) {

        document.getElementById("result")
          .innerHTML =
          "<b>QR READ SUCCESSFULLY:</b><br><br>" +
          decodedText;

        document.getElementById("result")
          .style.display = "block";

        try {
          await scanner.stop();
        } catch(e) {}

      },

      function(errorMessage) {
        // Normal while camera searches for QR.
      }
    );

  }

  catch(err) {

    document.getElementById("error")
      .innerText =
      "Camera error: " + err;

    document.getElementById("error")
      .style.display = "block";

  }
}

</script>

</body>
</html>
